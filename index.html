<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Maitriser Claude AI | BMUSD</title>
<style>
  :root {
    --navy: #101b26;
    --navy-2: #16232f;
    --card: #1b2a38;
    --card-border: #2a3b4a;
    --gold: #c8872f;
    --gold-light: #e2a94f;
    --text: #eef2f5;
    --text-dim: #9db0c0;
    --green: #2f9e5b;
    --green-bg: rgba(47,158,91,0.14);
    --red: #d9534f;
    --red-bg: rgba(217,83,79,0.14);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--navy);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 48px 0;
  }
  header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 22px 24px;
    max-width: 900px;
    margin: 0 auto;
  }
  .logo-wrap { display: flex; align-items: center; }
  .logo-wrap img { height: 34px; width: auto; display: block; }
  .lang-toggle {
    display: flex;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .lang-btn {
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.02em;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .lang-btn.active {
    background: var(--gold);
    color: #1a1206;
  }
  main {
    width: 100%;
    max-width: 640px;
    padding: 12px 20px 0 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .hero {
    text-align: left;
    width: 100%;
    margin-bottom: 22px;
  }
  .hero h1 {
    font-size: 28px;
    line-height: 1.25;
    margin: 6px 0 8px 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .hero p.subtitle {
    color: var(--text-dim);
    font-size: 15px;
    margin: 0;
    max-width: 60ch;
  }
  .card {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 26px 24px 24px 24px;
  }
  #screen-start .card { text-align: left; }
  #screen-start p.desc {
    color: var(--text-dim);
    font-size: 15px;
    line-height: 1.55;
    margin: 0 0 22px 0;
  }
  .cta {
    display: inline-block;
    background: var(--gold);
    color: #1a1206;
    font-weight: 700;
    font-size: 15px;
    border: none;
    padding: 13px 22px;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.15s ease;
  }
  .cta:hover { background: var(--gold-light); }
  .cta:active { transform: scale(0.98); }
  .cta:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    margin-bottom: 10px;
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 600;
  }
  .progress-track {
    width: 100%;
    height: 6px;
    background: var(--navy-2);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 999px;
    transition: width 0.35s ease;
    width: 0%;
  }
  .question-text {
    font-size: 19px;
    font-weight: 700;
    line-height: 1.4;
    margin: 0 0 20px 0;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }
  .option {
    text-align: left;
    background: var(--navy-2);
    border: 1.5px solid var(--card-border);
    color: var(--text);
    font-size: 15px;
    padding: 14px 16px;
    border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    font-family: inherit;
  }
  .option:hover:not(:disabled) {
    border-color: var(--gold);
  }
  .option:disabled { cursor: default; }
  .option.correct {
    background: var(--green-bg);
    border-color: var(--green);
    color: #b7f0cd;
  }
  .option.incorrect {
    background: var(--red-bg);
    border-color: var(--red);
    color: #f6c7c5;
  }
  .feedback-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 44px;
  }
  .feedback-label {
    font-size: 14px;
    font-weight: 700;
  }
  .feedback-label.correct { color: var(--green); }
  .feedback-label.incorrect { color: var(--red); }

  #screen-results .card { text-align: center; }
  .score-big {
    font-size: 52px;
    font-weight: 800;
    color: var(--gold);
    margin: 6px 0 2px 0;
    letter-spacing: -0.02em;
  }
  .score-sub {
    color: var(--text-dim);
    font-size: 14px;
    margin-bottom: 18px;
  }
  .result-msg {
    font-size: 15px;
    line-height: 1.6;
    margin: 0 auto 22px auto;
    max-width: 46ch;
  }

  footer {
    width: 100%;
    max-width: 640px;
    padding: 30px 20px 0 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-dim);
    font-size: 13px;
  }
  footer img.avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--gold);
    flex-shrink: 0;
  }
  footer .footer-text a {
    color: var(--gold-light);
    text-decoration: none;
  }
  footer .footer-text a:hover { text-decoration: underline; }
  footer .footer-text div:first-child {
    color: var(--text);
    font-weight: 600;
    font-size: 13.5px;
  }

  .hidden { display: none !important; }

  @media (max-width: 480px) {
    .hero h1 { font-size: 23px; }
    .card { padding: 20px 18px; }
    .score-big { font-size: 44px; }
  }
</style>
</head>

const STR = {"fr": {"title": "Quiz — Maîtriser Claude AI", "subtitle": "Testez votre niveau de maîtrise de Claude AI en contexte professionnel", "start": "Commencer le quiz", "startDesc": "24 questions pour évaluer vos connaissances sur Claude AI : usage, prompting, sécurité et confidentialité en entreprise.", "question": "Question", "of": "sur", "next": "Question suivante", "seeResults": "Voir mes résultats", "correct": "Bonne réponse !", "incorrect": "Réponse incorrecte", "resultsTitle": "Résultats", "scoreLabel": "Votre score", "restart": "Recommencer le quiz", "footerBy": "Un contenu de formation par", "msg_high": "Excellent ! Vous maîtrisez Claude AI, y compris ses réglages de confidentialité, à un niveau avancé.", "msg_mid": "Bon niveau ! Vous connaissez les bases, encore quelques notions de sécurité et de structure à approfondir.", "msg_low": "C'est un bon début. Revoyez les guides pour mieux maîtriser Claude AI et ses paramètres de sécurité au travail."}, "en": {"title": "Quiz — Mastering Claude AI", "subtitle": "Test how well you master Claude AI in a professional context", "start": "Start the quiz", "startDesc": "24 questions to assess your knowledge of Claude AI: usage, prompting, security and privacy at work.", "question": "Question", "of": "of", "next": "Next question", "seeResults": "See my results", "correct": "Correct answer!", "incorrect": "Incorrect answer", "resultsTitle": "Results", "scoreLabel": "Your score", "restart": "Restart the quiz", "footerBy": "Training content by", "msg_high": "Excellent! You master Claude AI, including its privacy settings, at an advanced level.", "msg_mid": "Good level! You know the basics — a few security and structuring notions still to deepen.", "msg_low": "A good start. Revisit the guides to better master Claude AI and its security settings at work."}};

let lang = 'fr';
let current = 0;
let score = 0;
let answered = false;

function t(key) { return STR[lang][key]; }

function setLang(newLang) {
  lang = newLang;
  document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.documentElement.lang = lang;
  renderStaticText();
  if (!document.getElementById('screen-quiz').classList.contains('hidden')) {
    renderQuestion();
  }
  if (!document.getElementById('screen-results').classList.contains('hidden')) {
    renderResults();
  }
}

function renderStaticText() {
  document.getElementById('hero-title').textContent = t('title');
  document.getElementById('hero-subtitle').textContent = t('subtitle');
  document.getElementById('start-desc').textContent = t('startDesc');
  document.getElementById('start-btn').textContent = t('start');
  document.getElementById('next-btn').textContent = current === QUESTIONS.length - 1 ? t('seeResults') : t('next');
  document.getElementById('results-title').textContent = t('resultsTitle');
  document.getElementById('footer-by').textContent = t('footerBy') + ' BMUSD';
  document.title = t('title') + ' | BMUSD';
}

function startQuiz() {
  current = 0;
  score = 0;
  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-quiz').classList.remove('hidden');
  document.getElementById('screen-results').classList.add('hidden');
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = QUESTIONS[current];
  const qLang = q[lang];
  const pct = Math.round((current) / QUESTIONS.length * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent =
    t('question') + ' ' + (current + 1) + ' ' + t('of') + ' ' + QUESTIONS.length;
  document.getElementById('question-text').textContent = qLang.q;

  const optionsEl = document.getElementById('options');
  optionsEl.innerHTML = '';
  qLang.o.forEach((optText, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = optText;
    btn.onclick = () => selectAnswer(idx, btn);
    optionsEl.appendChild(btn);
  });

  document.getElementById('feedback-label').textContent = '';
  document.getElementById('feedback-label').className = 'feedback-label';
  const nextBtn = document.getElementById('next-btn');
  nextBtn.classList.add('hidden');
  nextBtn.textContent = current === QUESTIONS.length - 1 ? t('seeResults') : t('next');
}

function selectAnswer(idx, btnEl) {
  if (answered) return;
  answered = true;
  const q = QUESTIONS[current];
  const correctIdx = q.c;
  const allBtns = document.querySelectorAll('#options .option');
  allBtns.forEach(b => b.disabled = true);

  const feedbackEl = document.getElementById('feedback-label');

  if (idx === correctIdx) {
    btnEl.classList.add('correct');
    score++;
    feedbackEl.textContent = t('correct');
    feedbackEl.className = 'feedback-label correct';
  } else {
    btnEl.classList.add('incorrect');
    allBtns[correctIdx].classList.add('correct');
    feedbackEl.textContent = t('incorrect');
    feedbackEl.className = 'feedback-label incorrect';
  }

  document.getElementById('next-btn').classList.remove('hidden');
}

function nextQuestion() {
  if (current < QUESTIONS.length - 1) {
    current++;
    renderQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-results').classList.remove('hidden');
  renderResults();
}

function renderResults() {
  const total = QUESTIONS.length;
  const pct = Math.round((score / total) * 100);
  document.getElementById('score-big').textContent = score + ' / ' + total;
  document.getElementById('score-sub').textContent = pct + '%';
  let msgKey = 'msg_low';
  if (pct >= 80) msgKey = 'msg_high';
  else if (pct >= 50) msgKey = 'msg_mid';
  document.getElementById('result-msg').textContent = t(msgKey);
  document.getElementById('restart-btn').textContent = t('restart');
}

function restartQuiz() {
  document.getElementById('screen-results').classList.add('hidden');
  document.getElementById('screen-start').classList.remove('hidden');
}

renderStaticText();
</script>
